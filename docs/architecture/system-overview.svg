<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 800 420"><title>LatentPagedAttention system overview</title><desc>Logical tokens resolve through a runtime block table into an FP16 physical latent cache, then FP32 latent attention produces an output projection. A full-KV baseline is shown below.</desc><style>.b{fill:#F5F3ED;stroke:#666861}.a{stroke:#9A6136;stroke-width:2;fill:none;marker-end:url(#m)}.t{font:16px sans-serif;fill:#1A1B18}.m{font:11px monospace;fill:#666861}.s{font:12px sans-serif;fill:#666861}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9A6136"/></marker></defs><rect width="800" height="420" fill="#F5F3ED"/><text class="m" x="32" y="28">CONTROLLED GPU EXPERIMENT / PRIMARY PATH</text><g transform="translate(32 55)"><rect class="b" width="145" height="70" rx="4"/><text class="m" x="12" y="20">INPUT</text><text class="t" x="12" y="45">logical token</text></g><g transform="translate(215 55)"><rect class="b" width="170" height="70" rx="4"/><text class="m" x="12" y="20">ADDRESSING</text><text class="t" x="12" y="45">runtime block table</text></g><g transform="translate(423 55)"><rect class="b" width="170" height="70" rx="4"/><text class="m" x="12" y="20">STORAGE</text><text class="t" x="12" y="45">physical FP16 cache</text></g><g transform="translate(631 55)"><rect class="b" width="137" height="70" rx="4"/><text class="m" x="12" y="20">OPTIONAL</text><text class="t" x="12" y="45">GPU latent write</text></g><path class="a" d="M177 90h38M385 90h38M593 90h38"/><g transform="translate(110 190)"><rect class="b" width="165" height="70" rx="4"/><text class="m" x="12" y="20">CONVERT</text><text class="t" x="12" y="45">FP16 load → FP32</text></g><g transform="translate(318 190)"><rect class="b" width="165" height="70" rx="4"/><text class="m" x="12" y="20">SCORES</text><text class="t" x="12" y="45">latent-space</text></g><g transform="translate(526 190)"><rect class="b" width="165" height="70" rx="4"/><text class="m" x="12" y="20">NORMALIZE</text><text class="t" x="12" y="45">mask + stable softmax</text></g><path class="a" d="M508 125 192 190M275 225h43M483 225h43"/><g transform="translate(235 315)"><rect class="b" width="165" height="70" rx="4"/><text class="m" x="12" y="20">AGGREGATE</text><text class="t" x="12" y="45">FP32 latent context</text></g><g transform="translate(470 315)"><rect class="b" width="165" height="70" rx="4"/><text class="m" x="12" y="20">OUTPUT</text><text class="t" x="12" y="45">output projection</text></g><path class="a" d="M608 260 318 315M400 350h70"/><path d="M32 402h736" stroke="#666861"/><text class="s" x="32" y="398">FULL-KV BASELINE: persistent projected K/V rows, same paging controls, FP16 storage, FP32 attention</text></svg>
