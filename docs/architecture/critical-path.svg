<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 800 360"><title>LatentPagedAttention memory versus compute</title><desc>Persistent full K/V rows are compared with persistent FP16 latent rows and decode-time latent arithmetic. A small validation lane shows Python, Rust CPU, and cuTile parity.</desc><style>.b{fill:#F5F3ED;stroke:#666861}.a{stroke:#9A6136;stroke-width:2;fill:none;marker-end:url(#m)}.t{font:16px sans-serif;fill:#1A1B18}.m{font:11px monospace;fill:#666861}.s{font:12px sans-serif;fill:#666861}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9A6136"/></marker></defs><rect width="800" height="360" fill="#F5F3ED"/><text class="m" x="35" y="28">MEMORY ↔ COMPUTE / SYNTHETIC PROFILE</text><g transform="translate(35 55)"><rect class="b" width="215" height="72" rx="4"/><text class="m" x="12" y="20">PERSISTENT STATE</text><text class="t" x="12" y="46">full K/V rows</text><text class="s" x="12" y="64">FP16</text></g><text class="s" x="270" y="94">vs</text><g transform="translate(330 55)"><rect class="b" width="215" height="72" rx="4"/><text class="m" x="12" y="20">PERSISTENT STATE</text><text class="t" x="12" y="46">latent rows</text><text class="s" x="12" y="64">FP16 • 16× cache-byte ratio</text></g><g transform="translate(590 55)"><rect class="b" width="175" height="72" rx="4"/><text class="m" x="12" y="20">MEASURED READ</text><text class="t" x="12" y="46">~32.6% slower</text><text class="s" x="12" y="64">sync host timing</text></g><path class="a" d="M545 91h45"/><path d="M35 155h730" stroke="#666861"/><text class="s" x="35" y="180">Trade-off: fewer persistent cache bytes, more decode-time latent-space arithmetic.</text><text class="m" x="35" y="220">VALIDATION EVIDENCE LANE</text><g transform="translate(35 240)"><rect class="b" width="190" height="60" rx="4"/><text class="m" x="12" y="20">ORACLE</text><text class="t" x="12" y="44">Python</text></g><g transform="translate(305 240)"><rect class="b" width="190" height="60" rx="4"/><text class="m" x="12" y="20">REFERENCE</text><text class="t" x="12" y="44">Rust CPU</text></g><g transform="translate(575 240)"><rect class="b" width="190" height="60" rx="4"/><text class="m" x="12" y="20">EXECUTION</text><text class="t" x="12" y="44">cuTile GPU parity</text></g><path class="a" d="M225 270h80M495 270h80"/><text class="s" x="35" y="335">Scope: persistent cache bytes only; not total GPU memory, serving, MLA reproduction, or general ranking.</text></svg>
